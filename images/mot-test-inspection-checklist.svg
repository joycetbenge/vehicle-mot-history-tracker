<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)" />

  <text x="80" y="65" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2">TECHNICAL MOT BLUEPRINT</text>
  <text x="80" y="110" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="800">Essential MOT Inspection Zones &amp; Checkpoints</text>
  <text x="80" y="145" fill="#94a3b8" font-family="sans-serif" font-size="16">Key components scrutinized during the official UK Ministry of Transport roadworthiness test</text>

  <!-- 6 Grid Zones -->
  <!-- Zone 1: Lighting & Signalling -->
  <g transform="translate(80, 180)" filter="url(#cardShadow)">
    <rect width="320" height="190" rx="14" fill="#151e36" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="45" cy="45" r="22" fill="#1e3a8a" />
    <text x="45" y="52" fill="#60a5fa" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">💡</text>
    <text x="80" y="42" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Lights &amp; Signalling (30%)</text>
    <text x="80" y="62" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="600">#1 MOST COMMON FAILURE</text>
    <text x="25" y="105" fill="#94a3b8" font-family="sans-serif" font-size="13">
      <tspan x="25" dy="0">• Headlamp alignment &amp; high beam</tspan>
      <tspan x="25" dy="22">• Brake lights, reverse &amp; fog lamps</tspan>
      <tspan x="25" dy="22">• Indicator flash rate &amp; hazards</tspan>
      <tspan x="25" dy="22">• Registration number plate illumination</tspan>
    </text>
  </g>

  <!-- Zone 2: Suspension & Steering -->
  <g transform="translate(440, 180)" filter="url(#cardShadow)">
    <rect width="320" height="190" rx="14" fill="#151e36" stroke="#334155" stroke-width="1.5" />
    <circle cx="45" cy="45" r="22" fill="#312e81" />
    <text x="45" y="52" fill="#818cf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⚙️</text>
    <text x="80" y="42" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Suspension &amp; Steering (20%)</text>
    <text x="80" y="62" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="600">HIGH WEAR COMPONENT</text>
    <text x="25" y="105" fill="#94a3b8" font-family="sans-serif" font-size="13">
      <tspan x="25" dy="0">• Shock absorber leaks &amp; damping</tspan>
      <tspan x="25" dy="22">• Coil spring fractures &amp; mounting</tspan>
      <tspan x="25" dy="22">• Ball joint &amp; track rod end play</tspan>
      <tspan x="25" dy="22">• Power steering fluid leaks &amp; rack</tspan>
    </text>
  </g>

  <!-- Zone 3: Brakes & Hydraulics -->
  <g transform="translate(800, 180)" filter="url(#cardShadow)">
    <rect width="320" height="190" rx="14" fill="#151e36" stroke="#334155" stroke-width="1.5" />
    <circle cx="45" cy="45" r="22" fill="#7f1d1d" />
    <text x="45" y="52" fill="#fca5a5" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">🛑</text>
    <text x="80" y="42" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Braking System (16%)</text>
    <text x="80" y="62" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="600">CRITICAL SAFETY THRESHOLD</text>
    <text x="25" y="105" fill="#94a3b8" font-family="sans-serif" font-size="13">
      <tspan x="25" dy="0">• Roller brake tester efficiency &gt;50%</tspan>
      <tspan x="25" dy="22">• Brake imbalance &amp; disc thickness</tspan>
      <tspan x="25" dy="22">• Flexible hose bulging / corrosion</tspan>
      <tspan x="25" dy="22">• Handbrake cable &amp; parking hold</tspan>
    </text>
  </g>

  <!-- Zone 4: Tyres & Wheels -->
  <g transform="translate(80, 400)" filter="url(#cardShadow)">
    <rect width="320" height="190" rx="14" fill="#151e36" stroke="#334155" stroke-width="1.5" />
    <circle cx="45" cy="45" r="22" fill="#14532d" />
    <text x="45" y="52" fill="#86efac" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">🛞</text>
    <text x="80" y="42" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Tyres &amp; Wheels (13%)</text>
    <text x="80" y="62" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="600">LEGAL LIMIT: 1.6MM TREAD</text>
    <text x="25" y="105" fill="#94a3b8" font-family="sans-serif" font-size="13">
      <tspan x="25" dy="0">• Central 3/4 tread depth standard</tspan>
      <tspan x="25" dy="22">• Sidewall cuts, cords &amp; bulges</tspan>
      <tspan x="25" dy="22">• TPMS warning light operation</tspan>
      <tspan x="25" dy="22">• Correct tyre sizing across axles</tspan>
    </text>
  </g>

  <!-- Zone 5: Visibility & Glass -->
  <g transform="translate(440, 400)" filter="url(#cardShadow)">
    <rect width="320" height="190" rx="14" fill="#151e36" stroke="#334155" stroke-width="1.5" />
    <circle cx="45" cy="45" r="22" fill="#0e7490" />
    <text x="45" y="52" fill="#67e8f9" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">👁️</text>
    <text x="80" y="42" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Visibility &amp; Windscreen (9%)</text>
    <text x="80" y="62" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">DRIVER VIEW FIELD (ZONE A)</text>
    <text x="25" y="105" fill="#94a3b8" font-family="sans-serif" font-size="13">
      <tspan x="25" dy="0">• Max 10mm damage in Zone A</tspan>
      <tspan x="25" dy="22">• Max 40mm damage in remainder</tspan>
      <tspan x="25" dy="22">• Wiper blade split &amp; smearing check</tspan>
      <tspan x="25" dy="22">• Washer fluid reservoir filled</tspan>
    </text>
  </g>

  <!-- Zone 6: Emissions & Exhaust -->
  <g transform="translate(800, 400)" filter="url(#cardShadow)">
    <rect width="320" height="190" rx="14" fill="#151e36" stroke="#334155" stroke-width="1.5" />
    <circle cx="45" cy="45" r="22" fill="#701a75" />
    <text x="45" y="52" fill="#f0abfc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">💨</text>
    <text x="80" y="42" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Emissions &amp; Exhaust (12%)</text>
    <text x="80" y="62" fill="#e879f9" font-family="sans-serif" font-size="12" font-weight="600">ENVIRONMENTAL MANDATE</text>
    <text x="25" y="105" fill="#94a3b8" font-family="sans-serif" font-size="13">
      <tspan x="25" dy="0">• Carbon monoxide (CO) &amp; Hydrocarbons</tspan>
      <tspan x="25" dy="22">• Diesel particulate filter (DPF) check</tspan>
      <tspan x="25" dy="22">• Exhaust gas leaks &amp; security mounts</tspan>
      <tspan x="25" dy="22">• Lambda sensor reading &amp; smoke meter</tspan>
    </text>
  </g>
</svg>