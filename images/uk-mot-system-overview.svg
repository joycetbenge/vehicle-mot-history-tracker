<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200 M0 420 H1200 M0 490 H1200 M0 560 H1200" />
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" />
  </g>

  <!-- Header Badge -->
  <rect x="80" y="45" width="220" height="34" rx="17" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
  <text x="190" y="67" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">DVSA STANDARDS 2026</text>

  <!-- Title & Subtitle -->
  <text x="80" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">UK Vehicle MOT Testing Architecture</text>
  <text x="80" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">Official Categorisation of Vehicle Defects, Inspection Thresholds &amp; Legal Severity</text>

  <!-- Cards Grid -->
  <!-- Card 1: Dangerous -->
  <g transform="translate(80, 200)" filter="url(#shadow)">
    <rect width="240" height="360" rx="16" fill="#1e293b" stroke="#dc2626" stroke-width="2" />
    <rect x="0" y="0" width="240" height="70" rx="16" fill="url(#redGrad)" />
    <rect x="0" y="55" width="240" height="15" fill="url(#redGrad)" />
    <text x="120" y="42" fill="#ffffff" font-family="sans-serif" font-size="19" font-weight="800" text-anchor="middle">DANGEROUS</text>
    <rect x="20" y="88" width="80" height="24" rx="12" fill="#450a0a" />
    <text x="60" y="104" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">FAIL - ILLEGAL</text>
    <text x="20" y="145" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Immediate Risk:</text>
    <text x="20" y="172" fill="#94a3b8" font-family="sans-serif" font-size="13" line-height="1.5">
      <tspan x="20" dy="0">• Direct threat to life</tspan>
      <tspan x="20" dy="24">• Severely impaired brakes</tspan>
      <tspan x="20" dy="24">• Exposed tyre cords</tspan>
      <tspan x="20" dy="24">• Critical steering play</tspan>
      <tspan x="20" dy="24">• Cannot drive away</tspan>
    </text>
    <line x1="20" y1="300" x2="220" y2="300" stroke="#334155" stroke-width="1" />
    <text x="120" y="332" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Up to £2,500 Fine + 3 Pts</text>
  </g>

  <!-- Card 2: Major -->
  <g transform="translate(345, 200)" filter="url(#shadow)">
    <rect width="240" height="360" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect x="0" y="0" width="240" height="70" rx="16" fill="url(#amberGrad)" />
    <rect x="0" y="55" width="240" height="15" fill="url(#amberGrad)" />
    <text x="120" y="42" fill="#ffffff" font-family="sans-serif" font-size="19" font-weight="800" text-anchor="middle">MAJOR</text>
    <rect x="20" y="88" width="70" height="24" rx="12" fill="#451a03" />
    <text x="55" y="104" fill="#fcd34d" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">FAIL</text>
    <text x="20" y="145" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Standard Failures:</text>
    <text x="20" y="172" fill="#94a3b8" font-family="sans-serif" font-size="13">
      <tspan x="20" dy="0">• Headlamp aim incorrect</tspan>
      <tspan x="20" dy="24">• Emissions exceed limit</tspan>
      <tspan x="20" dy="24">• Fluid leaks risking hazard</tspan>
      <tspan x="20" dy="24">• Worn suspension joint</tspan>
      <tspan x="20" dy="24">• Requires urgent repair</tspan>
    </text>
    <line x1="20" y1="300" x2="220" y2="300" stroke="#334155" stroke-width="1" />
    <text x="120" y="332" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">10 Working Day Retest</text>
  </g>

  <!-- Card 3: Minor -->
  <g transform="translate(610, 200)" filter="url(#shadow)">
    <rect width="240" height="360" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect x="0" y="0" width="240" height="70" rx="16" fill="#0284c7" />
    <rect x="0" y="55" width="240" height="15" fill="#0284c7" />
    <text x="120" y="42" fill="#ffffff" font-family="sans-serif" font-size="19" font-weight="800" text-anchor="middle">MINOR</text>
    <rect x="20" y="88" width="75" height="24" rx="12" fill="#0c4a6e" />
    <text x="57" y="104" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">PASS NOTE</text>
    <text x="20" y="145" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Technical Items:</text>
    <text x="20" y="172" fill="#94a3b8" font-family="sans-serif" font-size="13">
      <tspan x="20" dy="0">• Non-critical fault</tspan>
      <tspan x="20" dy="24">• License plate lamp bulb</tspan>
      <tspan x="20" dy="24">• Slight brake hose wear</tspan>
      <tspan x="20" dy="24">• Logged on MOT history</tspan>
      <tspan x="20" dy="24">• Repair recommended</tspan>
    </text>
    <line x1="20" y1="300" x2="220" y2="300" stroke="#334155" stroke-width="1" />
    <text x="120" y="332" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Valid Pass Granted</text>
  </g>

  <!-- Card 4: Advisory -->
  <g transform="translate(875, 200)" filter="url(#shadow)">
    <rect width="240" height="360" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="240" height="70" rx="16" fill="url(#greenGrad)" />
    <rect x="0" y="55" width="240" height="15" fill="url(#greenGrad)" />
    <text x="120" y="42" fill="#ffffff" font-family="sans-serif" font-size="19" font-weight="800" text-anchor="middle">ADVISORY</text>
    <rect x="20" y="88" width="80" height="24" rx="12" fill="#064e3b" />
    <text x="60" y="104" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">WATCHLIST</text>
    <text x="20" y="145" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Future Monitoring:</text>
    <text x="20" y="172" fill="#94a3b8" font-family="sans-serif" font-size="13">
      <tspan x="20" dy="0">• Tyre worn near 1.6mm</tspan>
      <tspan x="20" dy="24">• Slight oil misting shock</tspan>
      <tspan x="20" dy="24">• Brake pad 70% worn</tspan>
      <tspan x="20" dy="24">• Surface corrosion early</tspan>
      <tspan x="20" dy="24">• Critical for buyers</tspan>
    </text>
    <line x1="20" y1="300" x2="220" y2="300" stroke="#334155" stroke-width="1" />
    <text x="120" y="332" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Key Negotiation Tool</text>
  </g>
</svg>