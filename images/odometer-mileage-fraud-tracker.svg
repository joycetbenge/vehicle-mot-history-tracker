<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fraudAlert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)" />

  <text x="80" y="65" fill="#f87171" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2">FRAUD DETECTION &amp; CONSUMER PROTECTION</text>
  <text x="80" y="110" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="800">Odometer Clocking &amp; Mileage Discrepancy Analysis</text>
  <text x="80" y="145" fill="#94a3b8" font-family="sans-serif" font-size="16">How historical DVLA MOT inspection records expose illegal mileage rollbacks in used vehicles</text>

  <!-- Left: Graph Panel -->
  <g transform="translate(80, 180)">
    <rect width="660" height="400" rx="16" fill="#151e36" stroke="#334155" stroke-width="1.5" />
    
    <!-- Y-axis labels -->
    <text x="70" y="70" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="end">120k mi</text>
    <line x1="80" y1="65" x2="620" y2="65" stroke="#1e293b" stroke-width="1" />
    <text x="70" y="140" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="end">90k mi</text>
    <line x1="80" y1="135" x2="620" y2="135" stroke="#1e293b" stroke-width="1" />
    <text x="70" y="210" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="end">60k mi</text>
    <line x1="80" y1="205" x2="620" y2="205" stroke="#1e293b" stroke-width="1" />
    <text x="70" y="280" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="end">30k mi</text>
    <line x1="80" y1="275" x2="620" y2="275" stroke="#1e293b" stroke-width="1" />
    <text x="70" y="340" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="end">0 mi</text>
    <line x1="80" y1="335" x2="620" y2="335" stroke="#334155" stroke-width="1.5" />

    <!-- X-axis years -->
    <text x="140" y="365" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">2021 (Year 3)</text>
    <text x="260" y="365" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">2022 (Year 4)</text>
    <text x="380" y="365" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">2023 (Year 5)</text>
    <text x="500" y="365" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2024 (TAMPERED)</text>

    <!-- Normal line to Year 5 -->
    <polyline points="140,270 260,200 380,110" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    
    <!-- Fraudulent rollback drop -->
    <line x1="380" y1="110" x2="500" y2="225" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,6" stroke-linecap="round" />

    <!-- Expected trajectory (ghost) -->
    <line x1="380" y1="110" x2="500" y2="50" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" />
    <text x="510" y="52" fill="#64748b" font-family="sans-serif" font-size="11">Expected: 125,000 mi</text>

    <!-- Data points -->
    <circle cx="140" cy="270" r="7" fill="#10b981" />
    <text x="140" y="255" fill="#f1f5f9" font-family="sans-serif" font-size="12" text-anchor="middle">32,410 mi</text>

    <circle cx="260" cy="200" r="7" fill="#10b981" />
    <text x="260" y="185" fill="#f1f5f9" font-family="sans-serif" font-size="12" text-anchor="middle">63,180 mi</text>

    <circle cx="380" cy="110" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <text x="380" y="95" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">101,240 mi</text>

    <!-- Tampered point -->
    <circle cx="500" cy="225" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <text x="500" y="210" fill="#f87171" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">52,000 mi ⚠️</text>

    <!-- Warning Tag -->
    <rect x="420" y="270" width="180" height="40" rx="8" fill="#7f1d1d" stroke="#ef4444" />
    <text x="510" y="295" fill="#fee2e2" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">49,240 MILES CLOCKED!</text>
  </g>

  <!-- Right: Verification Checklist Panel -->
  <g transform="translate(770, 180)">
    <rect width="350" height="400" rx="16" fill="#151e36" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="45" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">DVLA Check Signals</text>
    
    <g transform="translate(30, 80)">
      <circle cx="15" cy="15" r="14" fill="#065f46" />
      <text x="15" y="20" fill="#6ee7b7" font-family="sans-serif" font-size="13" text-anchor="middle">✓</text>
      <text x="40" y="14" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Linear Annual Mileage</text>
      <text x="40" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12">Typical UK avg: 7k - 10k miles/yr</text>
    </g>

    <g transform="translate(30, 150)">
      <circle cx="15" cy="15" r="14" fill="#7f1d1d" />
      <text x="15" y="20" fill="#fca5a5" font-family="sans-serif" font-size="13" text-anchor="middle">!</text>
      <text x="40" y="14" fill="#f87171" font-family="sans-serif" font-size="14" font-weight="600">Sudden Mileage Drop</text>
      <text x="40" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12">Indicates odometer replacement or fraud</text>
    </g>

    <g transform="translate(30, 220)">
      <circle cx="15" cy="15" r="14" fill="#78350f" />
      <text x="15" y="20" fill="#fcd34d" font-family="sans-serif" font-size="13" text-anchor="middle">?</text>
      <text x="40" y="14" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="600">Zero Mileage Gain</text>
      <text x="40" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12">Broken cable or long-term storage</text>
    </g>

    <g transform="translate(30, 290)">
      <circle cx="15" cy="15" r="14" fill="#1e3a8a" />
      <text x="15" y="20" fill="#93c5fd" font-family="sans-serif" font-size="13" text-anchor="middle">ℹ</text>
      <text x="40" y="14" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="600">Cross-Verify with V5C</text>
      <text x="40" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12">Check full stamped dealer service log</text>
    </g>

    <rect x="25" y="340" width="300" height="38" rx="8" fill="#1e293b" />
    <text x="175" y="364" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Legal protection under CPARs 2008</text>
  </g>
</svg>